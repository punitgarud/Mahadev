name: Mahadev 24H Paper
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install axios @solana/web3.js
      - run: node engine.js
      - run: |
          git config user.name "mahadev-bot"
          git config user.email "bot@mahadev.com"
          git add *.json
          git diff --staged --quiet || git commit -m "cycle update $(date -u)"
          git push
