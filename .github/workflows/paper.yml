name: Mahadev 24H Paper
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios
      - run: node bot.js
      - run: |
          git config user.name "mahadev-bot"
          git config user.email "bot@mahadev.com"
          git add pnl.json trades.json modules_stats.json
          git diff --staged --quiet || git commit -m "update 16H paper $(date)"
          git push
