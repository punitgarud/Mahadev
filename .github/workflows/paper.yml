name: Mahadev 24H Paper
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'  # every 5 mins
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install axios
      - run: node bot.js
      - run: |
          git config user.name "mahadev-bot"
          git config user.email "bot@mahadev.com"
          git add pnl.json trades.json || true
          git commit -m "update pnl $(date)" || true
          git push || true
